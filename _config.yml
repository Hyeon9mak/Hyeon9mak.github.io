# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Theme Settings
remote_theme: mmistakes/so-simple-theme
skin: "/assets/css/skins/default.css"

# Site Settings
locale: en-US
title: "현구막 기술 블로그"
description: "부지런히 살자"
url: "https://Hyeon9mak.github.io"
baseurl: ""
logo: "/assets/images/9git_logo.png"
date_format: "%Y-%m-%d"
read_time: true
words_per_minute: 200

# Analytics (So Simple ships classic GA only)
google_analytics: "UA-157445169-1"

# Comments: giscus (custom override — see _layouts/post.html & _includes/giscus.html)
giscus:
  repo: "Hyeon9mak/Hyeon9mak.github.io"
  repo-id: "MDEwOlJlcG9zaXRvcnkyMzcxNzExMzk="
  category: "Blog comments"
  category-id: "DIC_kwDODiLxw84CUl7Z"
  mapping: "pathname"
  strict: "0"
  reactions-enabled: "1"
  emit-metadata: "0"
  input-position: "bottom"
  theme: "light"
  lang: "ko"

# Liquid
liquid:
  error_mode: warn

# Build settings
markdown: kramdown
feed:
  path: atom.xml

# Pagination
paginate: 5
paginate_path: /page:num/

# Search
search_full_content: true

# Taxonomy pages
category_archive_path: "/categories/#"
tag_archive_path: "/tags/#"

# Outputting
permalink: /:categories/:title/
timezone: Asia/Seoul

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-remote-theme

# Reading Files
include:
  - _pages

# Front Matter Defaults
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      comments: true
      share: true

# Site Author
author:
  name: "현구막"
  picture: "/assets/images/9vatar.png"
  email: "jinha3507@gmail.com"
  links:
    - title: "GitHub"
      url: "https://github.com/Hyeon9mak/"
      icon: "fab fa-github-square"
    - title: "Twitter"
      url: "https://twitter.com/hyeon9mak"
      icon: "fab fa-twitter-square"
    - title: "Facebook"
      url: "https://facebook.com/Hyeon9mak"
      icon: "fab fa-facebook-square"
    - title: "LinkedIn"
      url: "https://www.linkedin.com/in/hyeon9mak"
      icon: "fab fa-linkedin"
    - title: "Careerly"
      url: "https://careerly.co.kr/profiles/489909"
      icon: "fas fa-link"

# Footer Links
footer_links:
